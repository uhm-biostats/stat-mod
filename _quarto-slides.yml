project:
  output-dir: docs
  render:
    - "*-slides.qmd"

format:
  revealjs:
    slide-number: true
    preview-links: auto
    auto-stretch: false
    embed-resources: false
    controls: true
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js"

execute:
  freeze: auto
